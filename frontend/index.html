<!doctype html>
<html lang="en" data-theme="chamber">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sparring — AI Debate Practice & Argument Strengthener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('sparring_theme') || 'dark';
          var isDark = t === 'system' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) : (t === 'dark');
          document.documentElement.setAttribute('data-theme', isDark ? 'chamber' : 'chamber-light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#11141A] text-[#F3F4F6] font-sans min-h-screen antialiased selection:bg-[#F59E0B] selection:text-[#11141A]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
