<!doctype html>
<html lang="en" data-theme="chamber">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sparring — AI Debate Platform</title>
    <meta name="description" content="Challenge your thinking with Sparring, an AI-powered debate platform that helps you build stronger arguments, respond to counterpoints, and improve your reasoning." />
    <meta property="og:title" content="Sparring — Think sharper. Debate smarter." />
    <meta property="og:description" content="An intellectual debate arena where users take a stance against an intelligent AI opponent with real-time fallacy detection, argument scoring, and voice interaction." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('sparring_theme') || 'dark';
          var isDark = t === 'system' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) : (t === 'dark');
          document.documentElement.setAttribute('data-theme', isDark ? 'chamber' : 'chamber-light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#050507] text-[#F5F5F7] font-sans min-h-screen antialiased selection:bg-[#7C3AED]/30 selection:text-[#F5F5F7]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
